<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>波佐見集計ボード</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #121417; color: #f1f3f5; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1c1f24; border-bottom: 1px solid #2c3038; }
    .header-left { display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; font-weight: bold; padding: 2px 7px; border-radius: 10px; }
    .badge-active { background: rgba(6, 199, 85, 0.2); color: #06c755; border: 1px solid #06c755; }
    .badge-stop { background: rgba(134, 142, 150, 0.2); color: #adb5bd; border: 1px solid #495057; }
    .badge-count { background: rgba(255, 146, 43, 0.2); color: #ffa94d; border: 1px solid #ff922b; }
    .badge-room { background: rgba(77, 171, 247, 0.15); color: #74c0fc; border: 1px solid rgba(77, 171, 247, 0.4); }
    .btn-refresh { background: #2c3038; color: #fff; border: none; border-radius: 6px; padding: 5px 9px; font-size: 11px; cursor: pointer; }

    .board { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
    
    /* 合算チェックカード */
    .total-card { background: #1e2229; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #343a46; transition: all 0.2s; }
    .total-card.ok { background: rgba(6, 199, 85, 0.12); border-color: #06c755; }
    .total-card.ng { background: rgba(255, 107, 107, 0.1); border-color: #fa5252; }
    .total-label { font-size: 12px; font-weight: bold; }
    .total-sub { font-size: 11px; color: #adb5bd; margin-top: 2px; }
    .total-val { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .val-plus { color: #4dabf7; }
    .val-minus { color: #ff6b6b; }
    .val-zero { color: #51cf66; }

    /* テーブル一覧 */
    .table-box { background: #1c1f24; border-radius: 12px; border: 1px solid #2c3038; overflow: hidden; flex: 1; display: flex; flex-direction: column; }
    .table-header { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; padding: 7px 10px; background: #23272f; font-size: 11px; color: #868e96; font-weight: bold; border-bottom: 1px solid #2c3038; }
    .table-header span:not(:first-child) { text-align: right; }
    .table-body { overflow-y: auto; flex: 1; }
    .member-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; align-items: center; padding: 9px 10px; border-bottom: 1px solid #262a31; font-size: 13px; cursor: pointer; transition: background 0.15s; }
    .member-row:last-child { border-bottom: none; }
    .member-row.selected { background: rgba(6, 199, 85, 0.15); border-left: 3px solid #06c755; }
    .member-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
    .me-tag { font-size: 9px; background: #343a46; color: #ced4da; padding: 1px 4px; border-radius: 4px; }
    .col-num { text-align: right; font-weight: bold; font-variant-numeric: tabular-nums; }
    .col-sub { text-align: right; color: #adb5bd; font-size: 12px; font-variant-numeric: tabular-nums; }
    .empty-msg { text-align: center; color: #6c757d; font-size: 12px; padding: 20px 10px; }

    .board-tools { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #181b20; border-top: 1px solid #2c3038; }
    .tool-btn { background: #2c3038; color: #e9ecef; border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
    .tool-btn-del { background: rgba(201, 42, 42, 0.25); color: #ff8787; border: 1px solid rgba(201, 42, 42, 0.5); }

    .cmd-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 5px 12px; background: #181b20; }
    .cmd-btn { border: none; border-radius: 7px; padding: 7px 2px; font-size: 11px; font-weight: bold; color: #fff; cursor: pointer; }
    .btn-start { background: #2b8a3e; }
    .btn-change { background: #1971c2; }
    .btn-settle { background: #e67700; }
    .btn-kaere { background: #c92a2a; }

    .calc-area { background: #1c1f24; padding: 8px 12px 12px; border-top: 1px solid #2c3038; }
    .target-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #06c755; margin-bottom: 5px; font-weight: bold; }
    .input-box { display: flex; align-items: center; background: #121417; border: 1px solid #343a46; border-radius: 8px; padding: 4px 10px; margin-bottom: 6px; }
    .sign-btn { background: #2c3038; color: #fff; border: none; border-radius: 6px; width: 38px; height: 30px; font-size: 16px; font-weight: bold; margin-right: 8px; cursor: pointer; }
    .sign-minus { background: #c92a2a; }
    .input-display { flex: 1; text-align: right; font-size: 22px; font-weight: bold; color: #fff; }

    .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .key { background: #2b303a; color: #fff; border: none; border-radius: 8px; height: 36px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .key:active { background: #3d4452; }
    .key-sub { background: #21252b; color: #adb5bd; font-size: 13px; }
    .key-send { background: #06c755; color: #fff; grid-row: span 2; height: 77px; font-size: 15px; }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-card { background: #1e2229; border: 1px solid #495057; border-radius: 16px; width: 100%; max-width: 340px; padding: 20px; text-align: center; }
    .modal-title { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
    .modal-body { font-size: 14px; line-height: 1.6; margin-bottom: 16px; color: #e9ecef; white-space: pre-wrap; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-btn { flex: 1; padding: 11px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-line { background: #06c755; color: #fff; }
    .btn-close { background: #343a46; color: #fff; }

    .loading { position: fixed; top: 44px; right: 12px; background: rgba(0,0,0,0.85); color: #06c755; font-size: 11px; padding: 3px 9px; border-radius: 8px; display: none; z-index: 50; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span id="statusBadge" class="badge badge-stop">読込中</span>
      <span id="countBadge" class="badge badge-count">保存済: 0戦</span>
      <span id="roomBadge" class="badge badge-room">同期確認中</span>
    </div>
    <button class="btn-refresh" onclick="fetchState()">↻ 更新</button>
  </div>

  <div id="loading" class="loading">通信中...</div>

  <div class="board">
    <div id="totalCard" class="total-card">
      <div>
        <div id="checkTitle" class="total-label">合算チェック（0なら一致）</div>
        <div id="remainHint" class="total-sub">全員の勝ち負けを入力してください</div>
      </div>
      <div id="totalVal" class="total-val val-zero">0</div>
    </div>

    <div class="table-box">
      <div class="table-header">
        <span>プレイヤー (タップで選択)</span>
        <span>今回</span>
        <span>キープ</span>
        <span>通算</span>
      </div>
      <div class="table-body" id="memberList">
        <div class="empty-msg">データを読み込んでいます...</div>
      </div>
      <div class="board-tools">
        <button class="tool-btn" onclick="addProxyMember()">＋ メンバー追加(代理)</button>
        <button class="tool-btn tool-btn-del" onclick="removeSelectedUser()">選択中の今回値を消す</button>
      </div>
    </div>
  </div>

  <div class="cmd-bar">
    <button class="cmd-btn btn-start" onclick="runCmd('start')">波佐見さん</button>
    <button class="cmd-btn btn-change" onclick="runCmd('change')">変更</button>
    <button class="cmd-btn btn-settle" onclick="runCmd('settle')">決算</button>
    <button class="cmd-btn btn-kaere" onclick="runCmd('kaere')">帰れ</button>
  </div>

  <div class="calc-area">
    <div class="target-bar">
      <span id="targetLabel">入力対象: 自分</span>
      <span onclick="selectSelf()" style="text-decoration:underline; cursor:pointer; color:#adb5bd;">自分に戻す</span>
    </div>
    <div class="input-box">
      <button id="signBtn" class="sign-btn" onclick="toggleSign()">＋</button>
      <div id="inputDisplay" class="input-display">0</div>
    </div>
    <div class="keypad">
      <button class="key" onclick="pressNum('7')">7</button>
      <button class="key" onclick="pressNum('8')">8</button>
      <button class="key" onclick="pressNum('9')">9</button>
      <button class="key key-sub" onclick="clearInput()">C</button>

      <button class="key" onclick="pressNum('4')">4</button>
      <button class="key" onclick="pressNum('5')">5</button>
      <button class="key" onclick="pressNum('6')">6</button>
      <button class="key key-sub" onclick="backspace()">⌫</button>

      <button class="key" onclick="pressNum('1')">1</button>
      <button class="key" onclick="pressNum('2')">2</button>
      <button class="key" onclick="pressNum('3')">3</button>
      <button class="key key-send" onclick="submitVal()">送信</button>

      <button class="key key-sub" onclick="toggleSign()">± (ま)</button>
      <button class="key" onclick="pressNum('0')">0</button>
      <button class="key" onclick="pressNum('00')">00</button>
    </div>
  </div>

  <div id="modalBg" class="modal-bg">
    <div class="modal-card">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions">
        <button id="btnSendLine" class="modal-btn btn-line" onclick="pushSettleToLine()">公式LINEでトークに送る</button>
        <button class="modal-btn btn-close" onclick="closeModal()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2012565939-nRmRToVG";
    // ▼▼ ここだけGASのウェブアプリURLに書き換えてください ▼▼
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx2Bps0bOXSs6PFAFzMkn_UxA33AS0_wwmzPYatYgZO2pXNV54qWbORf4tnilMXz8Yv/exec";
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    function extractUrlChatId() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('chatId')) return params.get('chatId');
      const liffState = params.get('liff.state');
      if (liffState) {
        const decoded = decodeURIComponent(liffState);
        const stateParams = new URLSearchParams(decoded.startsWith('?') ? decoded : '?' + decoded);
        if (stateParams.get('chatId')) return stateParams.get('chatId');
      }
      return null;
    }

    const initialUrlChatId = extractUrlChatId();

    let chatId = initialUrlChatId || "default_room";
    let myUserId = "unknown_user";
    let myUserName = "自分";
    let selectedUserId = "unknown_user";
    let selectedUserName = "自分";
    let latestState = null;
    let settledCombinedData = null;

    let isMinus = false;
    let rawDigits = "";

    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        myUserId = profile.userId;
        myUserName = profile.displayName;
        selectedUserId = myUserId;
        selectedUserName = myUserName;
        updateTargetLabel();

        const ctx = liff.getContext();
        if (initialUrlChatId) {
          chatId = initialUrlChatId;
        } else if (ctx && (ctx.groupId || ctx.roomId)) {
          chatId = ctx.groupId || ctx.roomId;
        } else if (ctx && ctx.userId) {
          chatId = ctx.userId;
        } else {
          chatId = myUserId;
        }

        const isGroup = chatId.startsWith('C') || chatId.startsWith('R');
        document.getElementById('roomBadge').innerText = isGroup ? "グループ共有中" : "個人ルーム";
      } catch (e) {
        document.getElementById('roomBadge').innerText = "接続エラー";
      }

      fetchState();
      setInterval(fetchState, 4000);
    };

    function updateTargetLabel() {
      const isMe = (selectedUserId === myUserId);
      document.getElementById('targetLabel').innerText =
        `入力対象: ${selectedUserName}${isMe ? '（自分）' : '（代理入力）'}`;
    }

    function selectMember(uid, name) {
      selectedUserId = uid;
      selectedUserName = name;
      updateTargetLabel();
      if (latestState) renderState(latestState);
    }

    function selectSelf() {
      selectMember(myUserId, myUserName);
    }

    function addProxyMember() {
      const name = prompt("追加するメンバーの名前を入力してください");
      if (!name || !name.trim()) return;
      const proxyId = "proxy_" + name.trim();
      selectMember(proxyId, name.trim());
    }

    async function callGasApi(payload) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    function setLoading(flag) {
      document.getElementById('loading').style.display = flag ? 'block' : 'none';
    }

    function updateInputDisplay() {
      const disp = document.getElementById('inputDisplay');
      const signBtn = document.getElementById('signBtn');
      const numStr = rawDigits === "" ? "0" : rawDigits;
      disp.innerText = (isMinus && rawDigits !== "" ? "-" : "") + numStr;
      signBtn.innerText = isMinus ? "−" : "＋";
      signBtn.className = isMinus ? "sign-btn sign-minus" : "sign-btn";
    }

    function pressNum(d) {
      if (rawDigits === "" && (d === "0" || d === "00")) return;
      if (rawDigits.length >= 7) return;
      rawDigits += d;
      updateInputDisplay();
    }

    function toggleSign() {
      isMinus = !isMinus;
      updateInputDisplay();
    }

    function clearInput() {
      rawDigits = "";
      isMinus = false;
      updateInputDisplay();
    }

    function backspace() {
      rawDigits = rawDigits.slice(0, -1);
      updateInputDisplay();
    }

    function formatSigned(num) {
      if (num > 0) return `+${num}`;
      return `${num}`;
    }

    function renderState(state) {
      latestState = state;
      const statusBadge = document.getElementById('statusBadge');
      statusBadge.innerText = state.active ? "計算モード中" : "停止中";
      statusBadge.className = state.active ? "badge badge-active" : "badge badge-stop";
      document.getElementById('countBadge').innerText = `保存済: ${state.count || 0}戦`;

      const totalCard = document.getElementById('totalCard');
      const checkTitle = document.getElementById('checkTitle');
      const hintEl = document.getElementById('remainHint');
      const totalEl = document.getElementById('totalVal');

      const t = Number(state.total || 0);
      const inputCount = Object.keys(state.userValues || {}).length;

      totalEl.innerText = formatSigned(t);
      totalEl.className = "total-val " + (t > 0 ? "val-plus" : (t < 0 ? "val-minus" : "val-zero"));

      if (inputCount === 0) {
        totalCard.className = "total-card";
        checkTitle.innerText = "合算チェック（0なら一致）";
        hintEl.innerText = "各自の勝ち負け（+ / -）を入力してください";
      } else if (t === 0) {
        totalCard.className = "total-card ok";
        checkTitle.innerText = "✅ 波佐見OK（合算一致）";
        hintEl.innerText = "全員の合計が0で一致しています";
      } else {
        totalCard.className = "total-card ng";
        checkTitle.innerText = "⚠️ 合算ズレあり";
        hintEl.innerText = `合計が0になりません（差額: ${formatSigned(-t)}）`;
      }

      const listEl = document.getElementById('memberList');
      const allIds = new Set([
        myUserId,
        selectedUserId,
        ...Object.keys(state.userValues || {}),
        ...Object.keys(state.savedUserValues || {})
      ]);

      let html = '';
      allIds.forEach(uid => {
        if (!uid || uid === 'unknown_user') return;
        const cur = state.userValues ? state.userValues[uid] : null;
        const sav = state.savedUserValues ? state.savedUserValues[uid] : null;
        const name = (uid === myUserId) ? myUserName : ((cur && cur.name) || (sav && sav.name) || (uid === selectedUserId ? selectedUserName : '名無し'));
        const curVal = cur ? Number(cur.val) : 0;
        const savVal = sav ? Number(sav.val) : 0;
        const sumVal = curVal + savVal;

        const curClass = curVal > 0 ? 'val-plus' : (curVal < 0 ? 'val-minus' : '');
        const sumClass = sumVal > 0 ? 'val-plus' : (sumVal < 0 ? 'val-minus' : '');
        const isSelected = (uid === selectedUserId) ? 'selected' : '';
        const meBadge = (uid === myUserId) ? '<span class="me-tag">自分</span>' : '';

        html += `
          <div class="member-row ${isSelected}" onclick="selectMember('${uid}', '${name.replace(/'/g, "\\'")}')">
            <div class="member-name">${name}${meBadge}</div>
            <div class="col-num ${curClass}">${cur ? formatSigned(curVal) : '-'}</div>
            <div class="col-sub">${savVal !== 0 ? formatSigned(savVal) : '0'}</div>
            <div class="col-num ${sumClass}">${formatSigned(sumVal)}</div>
          </div>`;
      });

      listEl.innerHTML = html || '<div class="empty-msg">メンバーがいません</div>';
    }

    async function fetchState() {
      try {
        const res = await callGasApi({ action: 'getState', chatId: chatId });
        if (res.ok && res.state) renderState(res.state);
      } catch (e) {}
    }

    async function submitVal() {
      const num = rawDigits === "" ? 0 : parseInt(rawDigits, 10);
      const val = isMinus ? -num : num;
      clearInput();
      setLoading(true);

      try {
        const res = await callGasApi({
          action: 'submitValue',
          chatId: chatId,
          userId: selectedUserId,
          userName: selectedUserName,
          value: val
        });
        setLoading(false);
        if (res.ok) renderState(res.state);
      } catch (e) {
        setLoading(false);
        alert("通信エラーが発生しました");
      }
    }

    async function removeSelectedUser() {
      setLoading(true);
      try {
        const res = await callGasApi({
          action: 'removeUser',
          chatId: chatId,
          userId: selectedUserId
        });
        if (res.ok) renderState(res.state);
      } catch (e) {
        alert("削除に失敗しました");
      } finally {
        setLoading(false);
      }
    }

    async function runCmd(type) {
      setLoading(true);
      try {
        if (type === 'start') {
          const res = await callGasApi({ action: 'startGame', chatId: chatId });
          if (res.ok) renderState(res.state);
        } else if (type === 'change') {
          const res = await callGasApi({ action: 'saveChange', chatId: chatId });
          if (res.ok) {
            renderState(res.state);
            openModal('📦 変更（キープ完了）', '今回の数字をキープに保存しました。\n次のゲームの入力を始められます。', false);
          }
        } else if (type === 'settle') {
          const res = await callGasApi({ action: 'settle', chatId: chatId });
          if (res.ok) {
            renderState(res.state);
            settledCombinedData = res.combined || {};
            let lines = [];
            const keys = Object.keys(settledCombinedData);
            if (keys.length === 0) {
              lines.push('（データなし）');
            } else {
              keys.forEach(uid => {
                const item = settledCombinedData[uid];
                lines.push(`${item.name}: ${formatSigned(item.val)}`);
              });
            }
            openModal('💰 決算（総計）', lines.join('\n'), keys.length > 0);
          }
        } else if (type === 'kaere') {
          const res = await callGasApi({ action: 'kaere', chatId: chatId });
          if (res.ok) {
            renderState(res.state);
            openModal('停止完了', res.message, false);
          }
        }
      } catch (e) {
        alert("通信エラーが発生しました");
      } finally {
        setLoading(false);
      }
    }

    function openModal(title, bodyText, canPushSettle) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerText = bodyText;
      document.getElementById('btnSendLine').style.display = canPushSettle ? 'block' : 'none';
      document.getElementById('modalBg').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalBg').style.display = 'none';
    }

    async function pushSettleToLine() {
      if (!settledCombinedData) return;
      const btn = document.getElementById('btnSendLine');
      btn.innerText = "送信中...";
      btn.disabled = true;

      try {
        const res = await callGasApi({
          action: 'pushSettle',
          chatId: chatId,
          combined: settledCombinedData
        });
        if (res.ok) {
          closeModal();
        } else {
          alert(res.error || "送信に失敗しました");
        }
      } catch (e) {
        alert("通信エラーが発生しました");
      } finally {
        btn.innerText = "公式LINEでトークに送る";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
