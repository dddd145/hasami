<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>鋏さん 集計ボード</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #121417; color: #f1f3f5; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    /* ヘッダー */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; background: #1c1f24; border-bottom: 1px solid #2c3038; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; font-weight: bold; padding: 2px 7px; border-radius: 10px; }
    .badge-round { background: rgba(255, 146, 43, 0.2); color: #ffa94d; border: 1px solid #ff922b; }
    .badge-room { background: rgba(77, 171, 247, 0.15); color: #74c0fc; border: 1px solid rgba(77, 171, 247, 0.4); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #06c755; display: inline-block; }
    .sync-dot.busy { background: #ffa94d; }
    .btn-refresh { background: #2c3038; color: #fff; border: none; border-radius: 6px; padding: 4px 9px; font-size: 11px; cursor: pointer; }

    /* 上部ボード（5人収まるコンパクト設計） */
    .board { padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    
    /* 合算チェックカード（現在の値のみで判定） */
    .total-card { background: #1e2229; border-radius: 10px; padding: 7px 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #343a46; transition: all 0.15s; }
    .total-card.ok { background: rgba(6, 199, 85, 0.12); border-color: #06c755; }
    .total-card.ng { background: rgba(255, 107, 107, 0.1); border-color: #fa5252; }
    .total-label { font-size: 12px; font-weight: bold; }
    .total-sub { font-size: 10px; color: #adb5bd; margin-top: 1px; }
    .total-val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .val-plus { color: #4dabf7; }
    .val-minus { color: #ff6b6b; }
    .val-zero { color: #51cf66; }

    /* テーブル一覧（最大5人表示＋超過時スクロール） */
    .table-box { background: #1c1f24; border-radius: 10px; border: 1px solid #2c3038; overflow: hidden; display: flex; flex-direction: column; }
    .table-header { display: grid; padding: 6px 8px; background: #23272f; font-size: 10px; color: #868e96; font-weight: bold; border-bottom: 1px solid #2c3038; }
    .cols-4 { grid-template-columns: 1.5fr 1fr 1fr 1fr; }
    .cols-5 { grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; }
    .table-header span:not(:first-child) { text-align: right; }
    .table-body { overflow-y: auto; max-height: 180px; }
    .member-row { display: grid; align-items: center; height: 36px; padding: 0 8px; border-bottom: 1px solid #262a31; font-size: 12px; cursor: pointer; }
    .member-row:last-child { border-bottom: none; }
    .member-row.selected { background: rgba(6, 199, 85, 0.15); border-left: 3px solid #06c755; }
    .member-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
    .me-tag { font-size: 9px; background: #343a46; color: #ced4da; padding: 1px 4px; border-radius: 4px; flex-shrink: 0; }
    .col-num { text-align: right; font-weight: bold; font-variant-numeric: tabular-nums; }
    .col-sub { text-align: right; color: #adb5bd; font-size: 11px; font-variant-numeric: tabular-nums; }
    .empty-msg { text-align: center; color: #6c757d; font-size: 12px; padding: 14px 10px; }

    .board-tools { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; background: #181b20; border-top: 1px solid #2c3038; }
    .tool-btn { background: #2c3038; color: #e9ecef; border: none; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
    .tool-btn-del { background: rgba(201, 42, 42, 0.25); color: #ff8787; border: 1px solid rgba(201, 42, 42, 0.5); }

    /* コマンドバー（変更 / 決算） */
    .cmd-bar { display: grid; grid-template-columns: 1fr 1.2fr; gap: 8px; padding: 5px 10px; background: #181b20; flex-shrink: 0; }
    .cmd-btn { border: none; border-radius: 8px; padding: 8px 6px; font-size: 13px; font-weight: bold; color: #fff; cursor: pointer; }
    .cmd-btn:active { opacity: 0.8; }
    .btn-change { background: #1971c2; }
    .btn-settle { background: #e67700; }

    /* 電卓エリア（残り高さいっぱいに自動拡張してタップしやすく） */
    .calc-area { flex: 1; background: #1c1f24; padding: 8px 10px 14px; border-top: 1px solid #2c3038; display: flex; flex-direction: column; min-height: 0; }
    .target-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #06c755; margin-bottom: 5px; font-weight: bold; flex-shrink: 0; }
    .input-box { display: flex; align-items: center; background: #121417; border: 1px solid #343a46; border-radius: 8px; padding: 5px 10px; margin-bottom: 7px; flex-shrink: 0; }
    .sign-btn { background: #2c3038; color: #fff; border: none; border-radius: 6px; width: 42px; height: 34px; font-size: 18px; font-weight: bold; margin-right: 8px; cursor: pointer; }
    .sign-minus { background: #c92a2a; }
    .input-display { flex: 1; text-align: right; font-size: 24px; font-weight: bold; color: #fff; }

    .keypad { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6px; min-height: 0; }
    .key { background: #2b303a; color: #fff; border: none; border-radius: 10px; height: 100%; min-height: 42px; font-size: 19px; font-weight: bold; cursor: pointer; }
    .key:active { background: #3d4452; }
    .key-sub { background: #21252b; color: #adb5bd; font-size: 14px; }
    .key-send { background: #06c755; color: #fff; grid-row: span 2; height: 100%; font-size: 17px; }
    .key-send:active { background: #05a847; }

    /* モーダル */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-card { background: #1e2229; border: 1px solid #495057; border-radius: 16px; width: 100%; max-width: 340px; padding: 20px; text-align: center; }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
    .modal-body { font-size: 14px; line-height: 1.6; margin-bottom: 16px; color: #e9ecef; white-space: pre-wrap; }
    .modal-btn { width: 100%; padding: 11px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; background: #06c755; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span id="syncDot" class="sync-dot"></span>
      <span id="roundBadge" class="badge badge-round">第1戦</span>
      <span id="roomBadge" class="badge badge-room">接続中</span>
    </div>
    <button class="btn-refresh" onclick="manualRefresh()">↻ 更新</button>
  </div>

  <div class="board">
    <div id="totalCard" class="total-card">
      <div>
        <div id="checkTitle" class="total-label">合算チェック（現在の合計）</div>
        <div id="remainHint" class="total-sub">全員の「現在」の合計が 0 なら一致です</div>
      </div>
      <div id="totalVal" class="total-val val-zero">0</div>
    </div>

    <div class="table-box">
      <div id="tableHeader" class="table-header cols-4">
        <span>プレイヤー</span>
        <span>変更前</span>
        <span>今回</span>
        <span>現在</span>
      </div>
      <div class="table-body" id="memberList">
        <div class="empty-msg">読み込み中...</div>
      </div>
      <div class="board-tools">
        <button class="tool-btn" onclick="addProxyMember()">＋ メンバー追加</button>
        <button class="tool-btn tool-btn-del" onclick="resetSelectedCurrent()">選択中の今回を0に戻す</button>
      </div>
    </div>
  </div>

  <div class="cmd-bar">
    <button class="cmd-btn btn-change" onclick="runChange()">変更</button>
    <button class="cmd-btn btn-settle" onclick="runSettle()">💰 決算</button>
  </div>

  <div class="calc-area">
    <div class="target-bar">
      <span id="targetLabel">加算対象: 自分</span>
      <span onclick="selectSelf()" style="text-decoration:underline; cursor:pointer; color:#adb5bd;">自分に戻す</span>
    </div>
    <div class="input-box">
      <button id="signBtn" class="sign-btn" onclick="toggleSign()">＋</button>
      <div id="inputDisplay" class="input-display">0</div>
    </div>
    <div class="keypad">
      <button class="key" onclick="pressNum('7')">7</button>
      <button class="key" onclick="pressNum('8')">8</button>
      <button class="key" onclick="pressNum('9')">9</button>
      <button class="key key-sub" onclick="clearInput()">C</button>

      <button class="key" onclick="pressNum('4')">4</button>
      <button class="key" onclick="pressNum('5')">5</button>
      <button class="key" onclick="pressNum('6')">6</button>
      <button class="key key-sub" onclick="backspace()">⌫</button>

      <button class="key" onclick="pressNum('1')">1</button>
      <button class="key" onclick="pressNum('2')">2</button>
      <button class="key" onclick="pressNum('3')">3</button>
      <button class="key key-send" onclick="submitAdd()">加算</button>

      <button class="key key-sub" onclick="toggleSign()">± (ま)</button>
      <button class="key" onclick="pressNum('0')">0</button>
      <button class="key" onclick="pressNum('00')">00</button>
    </div>
  </div>

  <div id="modalBg" class="modal-bg">
    <div class="modal-card">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalBody" class="modal-body"></div>
      <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const LIFF_ID = "2012565939-nRmRToVG";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx2Bps0bOXSs6PFAFzMkn_UxA33AS0_wwmzPYatYgZO2pXNV54qWbORf4tnilMXz8Yv/exec";

    function extractUrlChatId() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('chatId')) return params.get('chatId');
      const liffState = params.get('liff.state');
      if (liffState) {
        const decoded = decodeURIComponent(liffState);
        const stateParams = new URLSearchParams(decoded.startsWith('?') ? decoded : '?' + decoded);
        if (stateParams.get('chatId')) return stateParams.get('chatId');
      }
      return null;
    }

    const initialUrlChatId = extractUrlChatId();

    let chatId = initialUrlChatId || "default_room";
    let myUserId = "unknown_user";
    let myUserName = "自分";
    let selectedUserId = "unknown_user";
    let selectedUserName = "自分";
    let latestState = { players: {}, changeCount: 0 };

    let isMinus = false;
    let rawDigits = "";
    let syncVersion = 0;
    let pollTimer = null;

    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        myUserId = profile.userId;
        myUserName = profile.displayName;
        selectedUserId = myUserId;
        selectedUserName = myUserName;
        updateTargetLabel();

        const ctx = liff.getContext();
        if (initialUrlChatId) {
          chatId = initialUrlChatId;
        } else if (ctx && (ctx.groupId || ctx.roomId)) {
          chatId = ctx.groupId || ctx.roomId;
        } else if (ctx && ctx.userId) {
          chatId = ctx.userId;
        } else {
          chatId = myUserId;
        }

        const isGroup = chatId.startsWith('C') || chatId.startsWith('R');
        document.getElementById('roomBadge').innerText = isGroup ? "グループ共有中" : "個人ルーム";
      } catch (e) {
        document.getElementById('roomBadge').innerText = "接続エラー";
      }

      renderState(latestState);
      startFastPolling();
    };

    function setSyncBusy(busy) {
      const dot = document.getElementById('syncDot');
      if (busy) dot.classList.add('busy');
      else dot.classList.remove('busy');
    }

    async function startFastPolling() {
      if (pollTimer) clearTimeout(pollTimer);
      await fetchState();
      pollTimer = setTimeout(startFastPolling, 1500);
    }

    function manualRefresh() {
      startFastPolling();
    }

    function updateTargetLabel() {
      const isMe = (selectedUserId === myUserId);
      document.getElementById('targetLabel').innerText =
        `加算対象: ${selectedUserName}${isMe ? '（自分）' : '（代理）'}`;
    }

    function selectMember(uid, name) {
      selectedUserId = uid;
      selectedUserName = name;
      updateTargetLabel();
      renderState(latestState);
    }

    function selectSelf() {
      selectMember(myUserId, myUserName);
    }

    function addProxyMember() {
      const name = prompt("追加するメンバーの名前を入力してください");
      if (!name || !name.trim()) return;
      const proxyId = "proxy_" + name.trim();
      selectMember(proxyId, name.trim());
    }

    async function callGasApi(payload) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    function updateInputDisplay() {
      const disp = document.getElementById('inputDisplay');
      const signBtn = document.getElementById('signBtn');
      const numStr = rawDigits === "" ? "0" : rawDigits;
      disp.innerText = (isMinus && rawDigits !== "" ? "-" : "") + numStr;
      signBtn.innerText = isMinus ? "−" : "＋";
      signBtn.className = isMinus ? "sign-btn sign-minus" : "sign-btn";
    }

    function pressNum(d) {
      if (rawDigits === "" && (d === "0" || d === "00")) return;
      if (rawDigits.length >= 7) return;
      rawDigits += d;
      updateInputDisplay();
    }

    function toggleSign() {
      isMinus = !isMinus;
      updateInputDisplay();
    }

    function clearInput() {
      rawDigits = "";
      isMinus = false;
      updateInputDisplay();
    }

    function backspace() {
      rawDigits = rawDigits.slice(0, -1);
      updateInputDisplay();
    }

    function formatSigned(num) {
      if (num > 0) return `+${num}`;
      return `${num}`;
    }

    function colorClass(num) {
      if (num > 0) return 'val-plus';
      if (num < 0) return 'val-minus';
      return '';
    }

    function renderState(state) {
      latestState = state || { players: {}, changeCount: 0 };
      const changeCount = Number(latestState.changeCount) || 0;
      const showTotalCol = changeCount > 0;

      document.getElementById('roundBadge').innerText = `第${changeCount + 1}戦`;

      const headerEl = document.getElementById('tableHeader');
      if (showTotalCol) {
        headerEl.className = 'table-header cols-5';
        headerEl.innerHTML = '<span>プレイヤー</span><span>変更前</span><span>今回</span><span>現在</span><span>通算</span>';
      } else {
        headerEl.className = 'table-header cols-4';
        headerEl.innerHTML = '<span>プレイヤー</span><span>変更前</span><span>今回</span><span>現在</span>';
      }

      const players = latestState.players || {};
      const allIds = new Set([
        myUserId,
        selectedUserId,
        ...Object.keys(players)
      ]);

      let sumCurrent = 0;
      let hasAnyCurrent = false;
      let html = '';

      allIds.forEach(uid => {
        if (!uid || uid === 'unknown_user') return;
        const p = players[uid];
        const name = (uid === myUserId) ? myUserName : ((p && p.name) || (uid === selectedUserId ? selectedUserName : '名無し'));
        const prev = p ? (Number(p.prev) || 0) : 0;
        const cur = p ? (Number(p.current) || 0) : 0;
        const settled = p ? (Number(p.settled) || 0) : 0;

        const diff = cur - prev;
        const total = settled + cur;

        sumCurrent += cur;
        if (cur !== 0) hasAnyCurrent = true;

        const isSelected = (uid === selectedUserId) ? 'selected' : '';
        const meBadge = (uid === myUserId) ? '<span class="me-tag">自分</span>' : '';
        const colClass = showTotalCol ? 'cols-5' : 'cols-4';
        const totalCell = showTotalCol
          ? `<div class="col-num ${colorClass(total)}">${formatSigned(total)}</div>`
          : '';

        html += `
          <div class="member-row ${colClass} ${isSelected}" onclick="selectMember('${uid}', '${name.replace(/'/g, "\\'")}')">
            <div class="member-name">${name}${meBadge}</div>
            <div class="col-sub">${formatSigned(prev)}</div>
            <div class="col-num ${colorClass(diff)}">${diff !== 0 ? formatSigned(diff) : '0'}</div>
            <div class="col-num ${colorClass(cur)}">${formatSigned(cur)}</div>
            ${totalCell}
          </div>`;
      });

      document.getElementById('memberList').innerHTML = html || '<div class="empty-msg">メンバーがいません</div>';

      // 合算チェックカード（「現在」の値の合計のみを見る）
      const totalCard = document.getElementById('totalCard');
      const checkTitle = document.getElementById('checkTitle');
      const hintEl = document.getElementById('remainHint');
      const totalEl = document.getElementById('totalVal');

      totalEl.innerText = formatSigned(sumCurrent);
      totalEl.className = "total-val " + (sumCurrent > 0 ? "val-plus" : (sumCurrent < 0 ? "val-minus" : "val-zero"));

      if (!hasAnyCurrent) {
        totalCard.className = "total-card";
        checkTitle.innerText = "合算チェック（現在の合計）";
        hintEl.innerText = "全員の「現在」の合計が 0 なら一致です";
      } else if (sumCurrent === 0) {
        totalCard.className = "total-card ok";
        checkTitle.innerText = "✅ 波佐見OK（合算一致）";
        hintEl.innerText = "全員の「現在」の合計が 0 で一致しています";
      } else {
        totalCard.className = "total-card ng";
        checkTitle.innerText = "⚠️ 合算ズレあり";
        hintEl.innerText = `現在の合計が 0 ではありません（差額: ${formatSigned(-sumCurrent)}）`;
      }
    }

    async function fetchState() {
      const reqVer = syncVersion;
      setSyncBusy(true);
      try {
        const res = await callGasApi({ action: 'getState', chatId: chatId });
        if (res.ok && res.state && reqVer === syncVersion) {
          renderState(res.state);
        }
      } catch (e) {
      } finally {
        setSyncBusy(false);
      }
    }

    async function submitAdd() {
      const num = rawDigits === "" ? 0 : parseInt(rawDigits, 10);
      if (num === 0) return;
      const val = isMinus ? -num : num;
      clearInput();

      syncVersion++;
      const myVer = syncVersion;
      if (!latestState.players[selectedUserId]) {
        latestState.players[selectedUserId] = { name: selectedUserName, prev: 0, current: 0, settled: 0 };
      }
      const beforeVal = Number(latestState.players[selectedUserId].current) || 0;
      latestState.players[selectedUserId].name = selectedUserName;
      latestState.players[selectedUserId].prev = beforeVal;
      latestState.players[selectedUserId].current = beforeVal + val;
      renderState(latestState);

      setSyncBusy(true);
      try {
        const res = await callGasApi({
          action: 'addValue',
          chatId: chatId,
          userId: selectedUserId,
          userName: selectedUserName,
          value: val
        });
        if (res.ok && res.state && myVer === syncVersion) {
          renderState(res.state);
        }
      } catch (e) {
        alert("通信エラーが発生しました");
      } finally {
        setSyncBusy(false);
      }
    }

    async function resetSelectedCurrent() {
      syncVersion++;
      const myVer = syncVersion;
      if (latestState.players[selectedUserId]) {
        latestState.players[selectedUserId].prev = 0;
        latestState.players[selectedUserId].current = 0;
        renderState(latestState);
      }

      setSyncBusy(true);
      try {
        const res = await callGasApi({
          action: 'resetPlayerCurrent',
          chatId: chatId,
          userId: selectedUserId
        });
        if (res.ok && res.state && myVer === syncVersion) renderState(res.state);
      } catch (e) {
        alert("リセットに失敗しました");
      } finally {
        setSyncBusy(false);
      }
    }

    async function runChange() {
      syncVersion++;
      const myVer = syncVersion;
      for (const uid in latestState.players) {
        const p = latestState.players[uid];
        p.settled = (Number(p.settled) || 0) + (Number(p.current) || 0);
        p.prev = 0;
        p.current = 0;
      }
      latestState.changeCount = (Number(latestState.changeCount) || 0) + 1;
      renderState(latestState);

      setSyncBusy(true);
      try {
        const res = await callGasApi({ action: 'commitChange', chatId: chatId });
        if (res.ok && res.state && myVer === syncVersion) {
          renderState(res.state);
        }
      } catch (e) {
        alert("通信エラーが発生しました");
      } finally {
        setSyncBusy(false);
      }
    }

    async function runSettle() {
      if (!confirm('決算結果を公式LINEからトークに送信し、すべての数値をリセットしますか？')) return;
      syncVersion++;
      const myVer = syncVersion;
      setSyncBusy(true);
      try {
        const res = await callGasApi({ action: 'settle', chatId: chatId });
        if (res.ok && res.state) {
          if (myVer === syncVersion) renderState(res.state);
          if (res.pushOk) {
            openModal('💰 決算完了', '公式LINEからトークに決算結果を送信し、全数値をリセットしました。');
          } else {
            openModal('⚠️ トーク送信エラー', res.pushError || '送信に失敗しました');
          }
        }
      } catch (e) {
        alert("通信エラーが発生しました");
      } finally {
        setSyncBusy(false);
      }
    }

    function openModal(title, bodyText) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerText = bodyText;
      document.getElementById('modalBg').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalBg').style.display = 'none';
    }
  </script>
</body>
</html>
